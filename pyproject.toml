[project]
name = "care_im_wrapper"
version = "0.1.0"
description = "CARE plugin: patient/staff chatbot over instant messaging, plus templated staff notifications."
readme = "README.md"
authors = [
  {name = "care_im_wrapper", email = "samiullahjavedd@gmail.com"}
]
maintainers = [
  {name = "care_im_wrapper", email = "samiullahjavedd@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
    "django",
    "celery",
    "djangorestframework",
    "httpx",
    "django-environ",
]
requires-python = ">= 3.13"  # matches CARE core

[project.optional-dependencies]
test = [
    "ruff",  # linting
]

[project.urls]
bugs = "https://github.com/8sami/care_im_wrapper/issues"
homepage = "https://github.com/8sami/care_im_wrapper"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
